<html lang="en">

    <meta charset="utf-8">
    <title>Gradient text paint layers</title>
    <style>html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        background: #ffffff;
      }

[data-composition-id="gradient-text"]:not(:has([data-hf-inner-root])), [data-composition-id="gradient-text"] > [data-hf-inner-root],
      [data-composition-id="gradient-text"]:not(:has([data-hf-inner-root])), [data-composition-id="gradient-text"] > [data-hf-inner-root] {
        margin: 0;
        background: #ffffff;
      }

      [data-composition-id="gradient-text"] [data-hf-authored-id="text"] {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #ffffff;
      }

      [data-composition-id="gradient-text"] .gradient {
        position: absolute;
        left: 120px;
        width: 1680px;
        height: 170px;
        font:
          120px/170px "DejaVu Sans",
          sans-serif;
        background: linear-gradient(#b91c1c, #1d4ed8);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      [data-composition-id="gradient-text"] #direct {
        top: 180px;
      }

      [data-composition-id="gradient-text"] #layered {
        top: 420px;
      }

      /* A child with its own paint layer must still contribute glyphs to the gradient mask.
         https://github.com/heygen-com/hyperframes/issues/5117 */
      [data-composition-id="gradient-text"] #layered-child {
        transform: translateY(0);
