    <style>html,
      body {
        width: 640px;
        height: 360px;
        margin: 0;
        overflow: hidden;
        background: #07111f;
      }

      #root,
      #child-host {
        position: absolute;
        inset: 0;
        width: 640px;
        height: 360px;
      }

[data-composition-id="child"]:not(:has([data-hf-inner-root])), [data-composition-id="child"] > [data-hf-inner-root] {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      width: 640px;
      height: 360px;
    }

    [data-composition-id="child"] .future-state {
      display: grid;
      gap: 14px;
      min-width: 420px;
      padding: 42px;
      border: 8px solid #d8ffe5;
      border-radius: 28px;
      color: #f4fff7;
      background: #087443;
      box-shadow: 0 24px 70px rgb(0 0 0 / 45%);
      font: 22px/1.3 Arial, sans-serif;
      text-align: center;
      visibility: visible;
    }
